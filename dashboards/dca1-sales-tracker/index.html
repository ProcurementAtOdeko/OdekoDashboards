<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#FFD100" />
<title>Odeko · DCA1 Sales Tracker</title>
<link rel="icon" type="image/png" href="../_shared/odeko-logo.png" />
<link rel="apple-touch-icon" href="../_shared/odeko-logo.png" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FBF7EC;
    --panel: #FFFFFF;
    --panel-2: #F5EFE0;
    --line: #E6DFCC;
    --ink: #2A1408;
    --ink-2: #40180B;
    --muted: #8A7B6A;
    --accent: #40180B;
    --accent-yellow: #FFD100;
    --green: #1F7A33;
    --green-soft: rgba(31,122,51,.12);
    --red: #B42318;
    --red-soft: rgba(180,35,24,.10);
    --amber: #B5660A;
    --amber-soft: rgba(181,102,10,.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 14px; }
  header .logo { width: 40px; height: 40px; border-radius: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--ink-2); }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  main { padding: 20px 24px 60px; max-width: 1600px; margin: 0 auto; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--ink-2); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .kpi.green .value { color: var(--green); }
  .kpi.accent { border-left: 3px solid var(--accent-yellow); }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .card h3 {
    margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-2);
  }
  .card .body { padding: 16px; }
  .card.chart .body { height: 280px; position: relative; }
  .card.tall .body { height: 420px; position: relative; }
  .card.full { grid-column: 1 / -1; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); align-items: center; background: var(--bg);
  }
  .toolbar input[type=search] {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; min-width: 220px;
    font-family: inherit;
  }
  .toolbar input:focus { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(64,24,11,.08); }
  .toolbar .count { color: var(--muted); font-size: 12px; }

  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
  .tabs button {
    background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-bottom: none;
    padding: 8px 16px; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; cursor: pointer; font-family: inherit;
  }
  .tabs button.active { background: var(--panel); color: var(--ink-2); border-bottom: 2px solid var(--accent-yellow); }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th {
    color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; cursor: pointer; user-select: none; background: var(--bg);
  }
  th:hover { color: var(--ink-2); }
  th.sort-asc::after { content: " ▲"; color: var(--accent); }
  th.sort-desc::after { content: " ▼"; color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #FAF4E4; }
  tr.detail td { background: var(--panel-2); padding: 0 12px 0 32px; }
  .detail-table { width: 100%; margin: 8px 0; }
  .detail-table td, .detail-table th { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); cursor: default; }
  .detail-table tr:last-child td { border-bottom: none; }
  .uuid { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-top: 2px; }
  .badge-new {
    display: inline-block; background: var(--green-soft); color: var(--green);
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 1px 7px; border-radius: 999px; margin-left: 6px;
  }
  .muted { color: var(--muted); }

  @media (max-width: 700px) {
    header { padding: 12px 14px; }
    header .logo { width: 32px; height: 32px; }
    header h1 { font-size: 15px; }
    main { padding: 14px 12px 40px; }
    th, td { padding: 7px 8px; font-size: 12px; }
    .kpi .value { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="../_shared/odeko-logo.png" alt="Odeko" width="40" height="40" />
    <div>
      <h1>DCA1 — Sales Tracker (Trailing 90 Days)</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>
  </div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <section class="charts">
    <div class="card chart full">
      <h3>Units Sold by Week</h3>
      <div class="body"><canvas id="chart-weekly"></canvas></div>
    </div>
    <div class="card tall">
      <h3>Top 10 Items — Units Sold</h3>
      <div class="body"><canvas id="chart-items"></canvas></div>
    </div>
    <div class="card tall">
      <h3>Top 10 Customers — Units Sold</h3>
      <div class="body"><canvas id="chart-customers"></canvas></div>
    </div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs">
      <button data-tab="items" class="active">Items</button>
      <button data-tab="customers">Customers</button>
      <button data-tab="placements">New Placements</button>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search…" />
      <span class="count" id="table-count"></span>
      <span class="count muted" id="table-hint">Click a row to see its breakdown</span>
    </div>
    <div style="overflow-x:auto">
      <table id="grid">
        <thead id="grid-head"></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const fmtInt = (n) => n == null ? "—" : n.toLocaleString(undefined, { maximumFractionDigits: 0 });
const fmt = (n) =>
  n == null ? "—" :
  Math.abs(n) >= 1000 ? n.toLocaleString(undefined, { maximumFractionDigits: 0 })
                      : n.toLocaleString(undefined, { maximumFractionDigits: 1 });
const fmtDate = (s) => s == null ? "—" : s;

const PALETTE = {
  ink: "#40180B", muted: "#8A7B6A", line: "#E6DFCC",
  green: "#1F7A33", amber: "#B5660A", red: "#B42318", yellow: "#FFD100", neutral: "#A89684",
};

let DATA = null;
let tab = "items";
let sortKey = "units";
let sortDir = "desc";
let filterText = "";
let expanded = new Set();

const TABS = {
  items: {
    columns: [
      { key: "name", label: "Item" },
      { key: "brand", label: "Brand" },
      { key: "units", label: "Units Sold", num: true },
      { key: "lines", label: "Order Lines", num: true },
      { key: "customers", label: "Customers", num: true },
      { key: "firstOrder", label: "First Order" },
      { key: "lastOrder", label: "Last Order" },
    ],
    defaultSort: "units",
  },
  customers: {
    columns: [
      { key: "name", label: "Customer" },
      { key: "units", label: "Units Sold", num: true },
      { key: "lines", label: "Order Lines", num: true },
      { key: "items", label: "SKUs", num: true },
      { key: "firstOrder", label: "First Order" },
      { key: "lastOrder", label: "Last Order" },
    ],
    defaultSort: "units",
  },
  placements: {
    columns: [
      { key: "customerName", label: "Customer" },
      { key: "itemName", label: "Item" },
      { key: "minDate", label: "First Order" },
      { key: "units", label: "Units Since", num: true },
      { key: "lines", label: "Order Lines", num: true },
      { key: "lastOrder", label: "Last Order" },
    ],
    defaultSort: "minDate",
  },
};

async function load() {
  const res = await fetch("./data.json", { cache: "no-store" });
  if (!res.ok) { document.getElementById("meta").textContent = "Failed to load data.json"; return; }
  DATA = await res.json();
  DATA.placements = DATA.pairs
    .filter(p => p.new)
    .map(p => ({
      ...p,
      customerName: DATA.customers[p.c].name,
      itemName: DATA.items[p.i].name,
      brand: DATA.items[p.i].brand,
    }));
  document.getElementById("meta").textContent =
    `Updated ${new Date(DATA.generatedAt).toLocaleString()} · ${DATA.dateRange.start} → ${DATA.dateRange.end}`;
  renderKpis();
  renderTable();
  try { renderCharts(); } catch (e) { console.error("Charts failed to render:", e); }
}

function renderKpis() {
  const s = DATA.summary;
  const kpis = [
    { label: "Units Sold (90d)", value: fmt(s.totalUnits), cls: "accent" },
    { label: "Order Lines", value: fmtInt(s.orderLines), cls: "" },
    { label: "Active Customers", value: fmtInt(s.customerCount), cls: "" },
    { label: "Active SKUs", value: fmtInt(s.itemCount), cls: "" },
    { label: `New Placements (${DATA.newPlacementDays}d)`, value: fmtInt(s.newPlacements), cls: "green" },
    { label: `New Customers (${DATA.newPlacementDays}d)`, value: fmtInt(s.newCustomers), cls: "green" },
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k =>
    `<div class="kpi ${k.cls}"><div class="label">${k.label}</div><div class="value">${k.value}</div></div>`
  ).join("");
}

function renderCharts() {
  Chart.defaults.color = PALETTE.muted;
  Chart.defaults.borderColor = PALETTE.line;
  Chart.defaults.font.family = '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  const wk = DATA.weeklyTrend;
  new Chart(document.getElementById("chart-weekly"), {
    type: "bar",
    data: {
      labels: wk.map(w => w.weekStart),
      datasets: [{
        data: wk.map(w => w.units),
        backgroundColor: PALETTE.ink,
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: (c) => `Week of ${c[0].label}`,
          label: (c) => `${fmt(c.raw)} units · ${fmtInt(wk[c.dataIndex].lines)} lines`,
        } },
      },
      scales: { y: { beginAtZero: true, title: { display: true, text: "Units Sold" } } },
    },
  });

  const ti = DATA.items.slice(0, 10);
  new Chart(document.getElementById("chart-items"), {
    type: "bar",
    data: {
      labels: ti.map(i => i.name.length > 44 ? i.name.slice(0, 42) + "…" : i.name),
      datasets: [{ data: ti.map(i => i.units), backgroundColor: PALETTE.ink, borderRadius: 4 }],
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${fmt(c.raw)} units` } } },
      scales: { x: { beginAtZero: true } },
    },
  });

  const tc = DATA.customers.slice(0, 10);
  new Chart(document.getElementById("chart-customers"), {
    type: "bar",
    data: {
      labels: tc.map(c => c.name.length > 44 ? c.name.slice(0, 42) + "…" : c.name),
      datasets: [{ data: tc.map(c => c.units), backgroundColor: PALETTE.neutral, borderRadius: 4 }],
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${fmt(c.raw)} units` } } },
      scales: { x: { beginAtZero: true } },
    },
  });
}

function rowsForTab() {
  if (tab === "items") return DATA.items;
  if (tab === "customers") return DATA.customers;
  return DATA.placements;
}

function searchableText(row) {
  if (tab === "placements") return `${row.customerName} ${row.itemName} ${row.brand || ""}`;
  return `${row.name} ${row.brand || ""} ${row.uuid}`;
}

function renderTable() {
  const spec = TABS[tab];
  const q = filterText.toLowerCase();
  let rows = rowsForTab().filter(r => !q || searchableText(r).toLowerCase().includes(q));

  rows = rows.slice().sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === "asc" ? av - bv : bv - av;
  });

  document.getElementById("table-count").textContent =
    `${fmtInt(rows.length)}${rows.length !== rowsForTab().length ? ` of ${fmtInt(rowsForTab().length)}` : ""} rows`;
  document.getElementById("table-hint").style.display = tab === "placements" ? "none" : "";

  document.getElementById("grid-head").innerHTML = "<tr>" + spec.columns.map(c =>
    `<th class="${c.num ? "num" : ""} ${sortKey === c.key ? (sortDir === "asc" ? "sort-asc" : "sort-desc") : ""}" data-sort="${c.key}">${c.label}</th>`
  ).join("") + "</tr>";

  document.getElementById("grid-body").innerHTML = rows.map(r => renderRow(r, spec)).join("");

  document.querySelectorAll("#grid-head th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = key === "name" || key === "customerName" || key === "itemName" ? "asc" : "desc"; }
      renderTable();
    });
  });

  document.querySelectorAll("#grid-body tr.row").forEach(tr => {
    tr.addEventListener("click", () => {
      const id = tr.dataset.id;
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      renderTable();
    });
  });
}

function renderRow(r, spec) {
  if (tab === "placements") {
    return `<tr>
      <td>${escapeHtml(r.customerName)}</td>
      <td>${escapeHtml(r.itemName)}${r.brand ? `<div class="uuid">${escapeHtml(r.brand)}</div>` : ""}</td>
      <td>${fmtDate(r.minDate)}<span class="badge-new">New</span></td>
      <td class="num">${fmt(r.units)}</td>
      <td class="num">${fmtInt(r.lines)}</td>
      <td>${fmtDate(r.lastOrder)}</td>
    </tr>`;
  }

  const isItem = tab === "items";
  const main = isItem
    ? `<tr class="row" data-id="${r.uuid}">
        <td>${escapeHtml(r.name)}<div class="uuid">${r.uuid.slice(0, 8)}</div></td>
        <td>${escapeHtml(r.brand || "")}</td>
        <td class="num">${fmt(r.units)}</td>
        <td class="num">${fmtInt(r.lines)}</td>
        <td class="num">${fmtInt(r.customers)}</td>
        <td>${fmtDate(r.firstOrder)}</td>
        <td>${fmtDate(r.lastOrder)}</td>
      </tr>`
    : `<tr class="row" data-id="${r.uuid}">
        <td>${escapeHtml(r.name)}<div class="uuid">${r.uuid.slice(0, 8)}</div></td>
        <td class="num">${fmt(r.units)}</td>
        <td class="num">${fmtInt(r.lines)}</td>
        <td class="num">${fmtInt(r.items)}</td>
        <td>${fmtDate(r.firstOrder)}</td>
        <td>${fmtDate(r.lastOrder)}</td>
      </tr>`;

  if (!expanded.has(r.uuid)) return main;
  return main + renderDetail(r, spec.columns.length);
}

function renderDetail(r, colspan) {
  const idx = tab === "items"
    ? DATA.items.findIndex(i => i.uuid === r.uuid)
    : DATA.customers.findIndex(c => c.uuid === r.uuid);
  const rel = DATA.pairs.filter(p => (tab === "items" ? p.i === idx : p.c === idx));
  const rows = rel.map(p => {
    const other = tab === "items" ? DATA.customers[p.c] : DATA.items[p.i];
    return `<tr>
      <td>${escapeHtml(other.name)}${p.new ? '<span class="badge-new">New</span>' : ""}</td>
      <td class="num">${fmt(p.units)}</td>
      <td class="num">${fmtInt(p.lines)}</td>
      <td>${fmtDate(p.minDate)}</td>
      <td>${fmtDate(p.lastOrder)}</td>
    </tr>`;
  }).join("");
  return `<tr class="detail"><td colspan="${colspan}">
    <table class="detail-table">
      <thead><tr>
        <th>${tab === "items" ? "Customer" : "Item"}</th>
        <th class="num">Units</th>
        <th class="num">Lines</th>
        <th>First Order</th>
        <th>Last Order</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </td></tr>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

document.getElementById("search").addEventListener("input", (e) => {
  filterText = e.target.value;
  renderTable();
});

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    tab = btn.dataset.tab;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b === btn));
    sortKey = TABS[tab].defaultSort;
    sortDir = "desc";
    expanded = new Set();
    renderTable();
  });
});

load();
</script>
</body>
</html>
