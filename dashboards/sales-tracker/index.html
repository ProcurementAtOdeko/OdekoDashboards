<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#FFD100" />
<title>Odeko · Sales Tracker</title>
<link rel="icon" type="image/png" href="../_shared/odeko-logo.png" />
<link rel="apple-touch-icon" href="../_shared/odeko-logo.png" />
<script>
  // Legacy deep links used a hash on this page (e.g. /sales-tracker/#DCA1).
  const legacy = decodeURIComponent(location.hash.replace("#", "")).toUpperCase();
  if (/^[A-Z0-9]{3,6}$/.test(legacy)) location.replace(`./${legacy}/`);
</script>
<style>
  :root {
    --bg: #FBF7EC; --panel: #FFFFFF; --line: #E6DFCC;
    --ink: #2A1408; --ink-2: #40180B; --muted: #8A7B6A; --accent-yellow: #FFD100;
    --green: #1F7A33; --red: #B42318;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--panel);
  }
  header .brand { display: flex; align-items: center; gap: 14px; }
  header img { width: 40px; height: 40px; border-radius: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  header .back { color: var(--muted); text-decoration: none; font-size: 12px; white-space: nowrap; }
  header .back:hover { color: var(--ink-2); }
  main { padding: 28px 24px 60px; max-width: 900px; margin: 0 auto; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li a, li .dead {
    display: block; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent-yellow); border-radius: 8px;
    color: var(--ink-2); text-decoration: none;
  }
  li a:hover { background: #FAF4E4; }
  li .dead { border-left-color: var(--line); color: var(--muted); }
  .name { font-weight: 600; font-size: 15px; }
  .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stat { font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    header { padding: 12px 14px; }
    header img { width: 32px; height: 32px; }
    header h1 { font-size: 15px; }
    main { padding: 16px 12px 40px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="../_shared/odeko-logo.png" alt="Odeko" width="40" height="40" />
    <div>
      <h1>Sales Tracker — Pick a Market</h1>
      <div class="sub" id="meta">Trailing 90 days · units sold, customers, items, trends, new placements</div>
    </div>
  </div>
  <a class="back" href="../">← All dashboards</a>
</header>
<main>
  <ul id="markets"><li class="desc">Loading…</li></ul>
</main>
<script>
const fmtInt = (n) => n == null ? "—" : n.toLocaleString(undefined, { maximumFractionDigits: 0 });

fetch("./data/manifest.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("manifest fetch failed"); return r.json(); })
  .then(m => {
    document.getElementById("meta").textContent =
      `Updated ${new Date(m.generatedAt).toLocaleString()} · trailing 90 days`;
    document.getElementById("markets").innerHTML = m.warehouses.map(w =>
      w.status === "ok"
        ? `<li><a href="./${w.code}/">
             <div class="name">${w.code}</div>
             <div class="desc stat">${fmtInt(w.summary.totalUnits)} units sold ·
               ${fmtInt(w.summary.customerCount)} customers ·
               ${fmtInt(w.summary.itemCount)} SKUs ·
               ${fmtInt(w.summary.newPlacements)} new placements (30d) ·
               ${w.dateRange.start} → ${w.dateRange.end}</div>
           </a></li>`
        : `<li><div class="dead">
             <div class="name">${w.code}</div>
             <div class="desc">Source export failed to refresh — will reappear automatically once Looker delivers clean data</div>
           </div></li>`
    ).join("");
  })
  .catch(() => { document.getElementById("markets").innerHTML = "<li class='desc'>Failed to load manifest.json</li>"; });
</script>
</body>
</html>
