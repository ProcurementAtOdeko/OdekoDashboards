[project]
name = "looker-mcp"
version = "0.1.0"
description = "MCP server wrapping read-only Looker API 4.0 tools."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "requests>=2.31.0",
]

[project.scripts]
looker-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]
