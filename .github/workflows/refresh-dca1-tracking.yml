name: Refresh DCA1 Tracking data

on:
  schedule:
    # Every 30 min, 11:00–17:00 UTC, weekdays. Covers ~7am–1pm ET in EDT
    # and ~6am–12pm ET in EST, so the source's pre-9am ET refresh is picked
    # up under either offset.
    - cron: "0,30 11-17 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-dca1-tracking.yml"
      - "dashboards/dca1-tracking/scripts/build_data.py"

permissions:
  contents: write

concurrency:
  group: refresh-dca1-tracking
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet google-api-python-client google-auth

      - name: Build data.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 dashboards/dca1-tracking/scripts/build_data.py \
            dashboards/dca1-tracking/data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/dca1-tracking/data.json
          if git diff --cached --quiet -- dashboards/dca1-tracking/data.json; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: refresh DCA1 Tracking data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
