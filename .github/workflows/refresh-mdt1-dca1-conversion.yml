name: Refresh MDT1 to DCA1 conversion data

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-mdt1-dca1-conversion.yml"
      - "dashboards/mdt1-dca1-conversion/scripts/build_data.py"

permissions:
  contents: write

concurrency:
  group: refresh-mdt1-dca1-conversion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet google-api-python-client google-auth

      - name: Build data.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 dashboards/mdt1-dca1-conversion/scripts/build_data.py \
            dashboards/mdt1-dca1-conversion/data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/mdt1-dca1-conversion/data.json
          if git diff --cached --quiet -- dashboards/mdt1-dca1-conversion/data.json; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: refresh MDT1 to DCA1 conversion data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
