name: Deploy dashboards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboards/**"
      - ".github/workflows/pages.yml"
  # GITHUB_TOKEN commits from refresh-*.yml don't trigger push events, so we
  # also redeploy whenever a refresh workflow completes.
  workflow_run:
    workflows:
      - "Refresh PO approval data"
      - "Refresh DCA1 Tracking data"
      - "Refresh DCA1 on-hand & ETA data"
      - "Refresh MDT1 to DCA1 conversion data"
      - "Refresh BNA1TO procurement data"
      - "Refresh expiration mitigation data"
      - "Refresh inventory adjustments data"
      - "Refresh sales tracker data"
      - "Snapshot Combined V2 model (8am ET)"
      - "Score V2 accuracy vs POs (8pm ET)"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards
      - id: deployment
        uses: actions/deploy-pages@v4
