name = "inbound-po-chat"
main = "index.js"
compatibility_date = "2024-11-01"

# Secrets (set via `wrangler secret put`):
#   ANTHROPIC_API_KEY        - from console.anthropic.com
#   GOOGLE_OAUTH_CLIENT_ID   - from Google Cloud Console (OAuth 2.0 Web client)

[vars]
# URL to the dashboard's data.json on the deployed Pages site (data.json is
# built by the deploy workflow and no longer committed to the repo).
DATA_URL = "https://procurementatodeko.github.io/OdekoDashboards/inbound-po-chat/data.json"
ANTHROPIC_MODEL = "claude-opus-4-7"
# CORS origin allowed to call the worker. Replace with the GitHub Pages origin.
ALLOWED_ORIGIN = "https://procurementatodeko.github.io"
