<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odeko Dashboards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FBF7EC;
      --panel: #FFFFFF;
      --line: #E6DFCC;
      --ink: #2A1408;
      --ink-2: #40180B;
      --muted: #8A7B6A;
      --accent-yellow: #FFD100;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-inner img {
      height: 32px;
      width: auto;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-2);
      margin: 0;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    .lede {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent-yellow);
      border-radius: 8px;
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    a.card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(42, 20, 8, 0.08);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-2);
      margin: 0 0 6px;
    }
    .card-slug {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="dashboards/_shared/odeko-logo.png" alt="Odeko" />
      <h1>Dashboards</h1>
    </div>
  </header>
  <main>
    <p class="lede">Static dashboards refreshed hourly from Google Sheets.</p>
    <div class="grid">
      <a class="card" href="dashboards/bna1to/">
        <p class="card-title">BNA1 Transfer Order Dashboard</p>
        <span class="card-slug">bna1to</span>
      </a>
      <a class="card" href="dashboards/dca1-onhand-eta/">
        <p class="card-title">DCA1 — On Hand &amp; ETA</p>
        <span class="card-slug">dca1-onhand-eta</span>
      </a>
      <a class="card" href="dashboards/dca1-tracking/">
        <p class="card-title">DCA1 — Tracking</p>
        <span class="card-slug">dca1-tracking</span>
      </a>
    </div>
  </main>
</body>
</html>
